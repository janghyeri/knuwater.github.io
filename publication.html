<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publication | KNU Water Resources Lab</title>
  <meta name="description" content="경북대학교 수자원 연구실 논문 및 학술발표 목록 — SCI(E) 논문, 국내 논문, 국제·국내 학술발표">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/site.js"></script>
  <script src="data/publications.js"></script>
  <style>
    .tabs{margin:-28px 0 0;position:relative;z-index:2}
    .tabs button{background:#fff;box-shadow:0 6px 16px rgba(2,8,23,.08)}
    .toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
    .toolbar .search{flex:1;min-width:260px;margin:0}
    .pub-list .pub-row:last-child{border-bottom:0}
    .pub-row .meta .me{font-weight:800;color:var(--ink)}
  </style>
</head>
<body>
<div id="site-header"></div>

<section class="page-hero" aria-label="Publication">
  <div class="pattern"></div>
  <div class="container">
    <div class="crumbs"><a href="index.html">Home</a> / Publication</div>
    <h1>Publication</h1>
    <p>연구실의 학술지 논문과 학술발표 목록입니다. 제목·저자·학술지명으로 검색할 수 있습니다.</p>
  </div>
</section>

<div class="container">
  <div class="tabs" role="tablist" aria-label="Publication categories" id="tabs"></div>
</div>

<main class="section" style="padding-top:40px">
  <div class="container">
    <div class="toolbar">
      <h2 class="kicker" id="kicker" style="margin:0"></h2>
      <div class="search"><input type="search" id="q" placeholder="검색: 제목, 저자, 학술지 (예: HEC-RAS, 유재환, 2024)" aria-label="논문 검색"></div>
    </div>
    <div class="pub-list" id="list"></div>
  </div>
</main>

<div id="site-footer"></div>

<script>
(function () {
  const P = (window.LAB_DATA || {}).publications || {};
  const ALL_CATS = [
    { key: "sci",      label: "SCI(E) 논문" },
    { key: "domestic", label: "국내 논문" },
    { key: "intConf",  label: "국제 학술발표" },
    { key: "domConf",  label: "국내 학술발표" },
    { key: "patent",   label: "특허" },
    { key: "book",     label: "저서·보고서" }
  ];
  // 항목이 하나도 없는 카테고리 탭은 자동으로 숨깁니다.
  const CATS = ALL_CATS.filter((c) => (P[c.key] || []).length);
  if (!CATS.length) CATS.push(ALL_CATS[0]);
  const tabsEl = document.getElementById("tabs");
  const listEl = document.getElementById("list");
  const kicker = document.getElementById("kicker");
  const input  = document.getElementById("q");
  let cur = CATS[0].key, q = "";

  // URL 해시로 탭 열기 (publication.html#domestic)
  const h = location.hash.slice(1);
  if (CATS.some((c) => c.key === h)) cur = h;

  tabsEl.innerHTML = CATS.map((c) =>
    `<button type="button" role="tab" data-tab="${c.key}" class="${c.key === cur ? "active" : ""}" aria-selected="${c.key === cur}">
      ${c.label}<span class="count">${(P[c.key] || []).length}</span>
    </button>`).join("");

  // 교수님 이름 강조
  function authors(s) {
    return esc(s).replace(/(Kim,\s?B\.?\s?H\.?\*?|김병현\*?)/g, '<span class="me">$1</span>');
  }

  function render() {
    const items = (P[cur] || []).map((it, i) => ({ ...it, _i: i }))
      .filter((it) => {
        if (!q) return true;
        return `${it.title} ${it.authors} ${it.venue} ${it.year}`.toLowerCase().includes(q);
      })
      .sort((a, b) => (b.year || 0) - (a.year || 0) || b._i - a._i);

    let html = "", year = null, n = items.length;
    items.forEach((it) => {
      if (it.year !== year) { year = it.year; html += `<div class="year-head">${esc(year)}</div>`; }
      const l = LAB.pubLink(it);
      html += `<div class="pub-row">
        <div class="num">${n--}</div>
        <div>
          <div class="title">${esc(it.title)}</div>
          <div class="meta">${authors(it.authors)}${it.venue ? ` · <b>${esc(it.venue)}</b>` : ""}</div>
        </div>
        <a class="btn outline sm" href="${esc(l.href)}" target="_blank" rel="noopener" title="${l.label === "Search" ? "Google Scholar에서 검색" : "원문 링크"}">${l.label}</a>
      </div>`;
    });
    listEl.innerHTML = html || `<p class="empty">검색 결과가 없습니다.</p>`;
    kicker.textContent = `${CATS.find((c) => c.key === cur).label} (${items.length})`;
  }

  tabsEl.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      cur = b.dataset.tab;
      tabsEl.querySelectorAll("button").forEach((x) => {
        const on = x === b;
        x.classList.toggle("active", on);
        x.setAttribute("aria-selected", String(on));
      });
      history.replaceState(null, "", "#" + cur);
      render();
    });
  });
  input.addEventListener("input", () => { q = input.value.trim().toLowerCase(); render(); });
  render();
})();
</script>
</body>
</html>
