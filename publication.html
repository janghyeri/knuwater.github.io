  <style>
    :root{
      --brand:#B5121B; --ink:#0f172a; --muted:#64748b; --line:#e5e7eb;
      --r:14px; --maxw:1200px; --header-h:64px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Pretendard Variable",system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans KR",sans-serif;color:var(--ink);background:#fff}
    a{text-decoration:none;color:inherit}

    /* Header / Nav */
    header{
      position:sticky; top:0; z-index:30;
      background:#ffffffcc; backdrop-filter:saturate(180%) blur(12px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      max-width:var(--maxw); margin:0 auto;
      min-height:var(--header-h);
      display:flex; align-items:center; gap:20px; padding:0 20px;
      font-weight:600;
    }
    .nav a:hover{color:var(--brand)}

    /* Hero */
    .hero{
      position:relative; min-height:260px;
      display:grid; place-items:center;
      background:#0a1424; color:#fff;
      padding:40px 20px 56px; /* 아래 여백 넉넉히 → 탭 안 겹치게 */
    }
    .hero h1{font-size:40px;margin:0}

    /* Tabs */
    .tabs{
      display:flex; justify-content:center; flex-wrap:wrap;
      gap:12px; padding:16px 20px 0; /* 예전 -18px 제거 */
    }
    .tabs button{
      padding:10px 14px; border:1px solid var(--line); border-radius:10px;
      background:#fff; font-weight:800; cursor:pointer;
      transition:all .15s ease;
    }
    .tabs button:hover{border-color:#cbd5e1; transform:translateY(-1px)}
    .tabs button.active{background:var(--brand);color:#fff;border-color:transparent}

    /* Main */
    main{max-width:var(--maxw); margin:0 auto; padding:32px 20px 40px}
    .kicker{font-size:22px;font-weight:900;margin:12px 0 16px}
    .pub-list{border-top:2px solid #0f172a10}

    .row{
      display:grid; grid-template-columns:56px 1fr 110px;
      gap:12px; align-items:center;
      padding:12px 0; border-bottom:1px solid var(--line)
    }
    .row .num{font-weight:900}
    .row .meta{font-size:14px;color:var(--muted)}
    .btn{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#f9fafb}
    .btn:hover{background:#eef2f7}

    /* Small screens */
    @media (max-width:640px){
      .row{grid-template-columns:36px 1fr; gap:8px}
      .row>div:last-child{grid-column:1/-1; justify-self:start; margin-top:6px}
      .hero h1{font-size:32px}
    }

    footer{padding:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted)}
  </style>
</head>

/* ---------- 렌더 ---------- */
function makeRow(idx, item){
  const link = item.link && item.link !== "#"
    ? `<a class="btn" href="${item.link}" target="_blank" rel="noopener">Link</a>`
    : `<span class="btn" style="opacity:.45;cursor:not-allowed">No link</span>`;
  return `<div class="row">
    <div class="num">${idx}</div>
    <div>
      <div style="font-weight:800">${item.title}</div>
      <div class="meta">${[item.authors, item.venue, item.year].filter(Boolean).join(" · ")}</div>
    </div>
    <div style="justify-self:end">${link}</div>
  </div>`;
}
function renderList(key, targetId){
  const list = (data[key]||[]).slice().sort((a,b)=>(b.year||0)-(a.year||0));
  document.getElementById(targetId).innerHTML =
    list.map((it,i)=>makeRow(i+1,it)).join("");
}
renderList("sci","list-sci");
renderList("domestic","list-domestic");
renderList("int-conf","list-int-conf");
renderList("dom-conf","list-dom-conf");

/* ---------- 탭 ---------- */
document.querySelectorAll(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tabs button").forEach(b=>{
      b.classList.remove("active");
      b.setAttribute("aria-selected","false");
    });
    btn.classList.add("active");
    btn.setAttribute("aria-selected","true");

    const key = btn.dataset.tab;
    document.querySelectorAll(".panel").forEach(p=>p.hidden=true);
    document.getElementById("panel-"+key).hidden=false;
  });
});
</script>
