backend:
  name: github
  repo: janghyeri/knuwater.github.io  # 👉 본인 깃허브 계정/저장소 이름
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

site_url: "https://knuwater.github.io"
logo_url: "/assets/knu-logo.png"
locale: "ko"

collections:
  - name: "research"
    label: "Research"
    folder: "content/research"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Hero Image", name: "hero", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "members"
    label: "Members"
    folder: "content/members"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name (KR/EN)", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "select", options: ["Professor","Researcher","Ph.D. Student","M.S. Student","Intern","Alumni"] }
      - { label: "Email", name: "email", widget: "string", required: false }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Interests", name: "interests", widget: "text", required: false }

  - name: "publications"
    label: "Publications"
    folder: "content/publications"
    create: true
    slug: "{{year}}-{{slug}}"
    fields:
      - { label: "Type", name: "type", widget: "select", options: ["Journal","Conference","Patent"] }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Authors", name: "authors", widget: "string" }
      - { label: "Venue", name: "venue", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Link", name: "link", widget: "string", required: false }

  - name: "gallery"
    label: "Gallery"
    folder: "content/gallery"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Caption", name: "caption", widget: "string", required: false }

