<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Members | KNU Water Resources Lab</title>
  <meta name="description" content="경북대학교 수자원 연구실 구성원 — 교수, 명예교수, 대학원생, 졸업생">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/site.js"></script>
  <script src="data/members.js"></script>
  <style>
    .tabs{margin:-28px 0 0;position:relative;z-index:2}
    .tabs button{background:#fff;box-shadow:0 6px 16px rgba(2,8,23,.08)}
    .person h3 .ko{font-size:18px;font-weight:700;color:var(--muted)}
    .alumni{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .alumni .card b{display:block;font-size:17px}
    .alumni .card small{color:var(--muted);display:block}
    @media (max-width:980px){.alumni{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.alumni{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="site-header"></div>

<section class="page-hero" aria-label="Members">
  <div class="pattern"></div>
  <div class="container">
    <div class="crumbs"><a href="index.html">Home</a> / Members</div>
    <h1>Members</h1>
    <p>연구실을 함께 만들어 가는 사람들입니다.</p>
  </div>
</section>

<div class="container">
  <div class="tabs" role="tablist" aria-label="Member categories">
    <button type="button" class="active" role="tab" aria-selected="true" aria-controls="panel-prof" data-tab="prof">Professor</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="panel-emeritus" data-tab="emeritus">Emeritus Professor</button>
    <button type="button" role="tab" aria-selected="false" aria-controls="panel-students" data-tab="students">Students <span class="count" id="cnt-students">0</span></button>
    <button type="button" role="tab" aria-selected="false" aria-controls="panel-alumni" data-tab="alumni">Alumni <span class="count" id="cnt-alumni">0</span></button>
  </div>
</div>

<main class="section" style="padding-top:40px">
  <div class="container">

    <section id="panel-prof" class="panel" role="tabpanel">
      <h2 class="kicker">Professor</h2>
      <div id="prof-block"></div>
    </section>

    <section id="panel-emeritus" class="panel" role="tabpanel" hidden>
      <h2 class="kicker">Emeritus Professor</h2>
      <div id="emeritus-block"></div>
    </section>

    <section id="panel-students" class="panel" role="tabpanel" hidden>
      <h2 class="kicker">Students</h2>
      <p class="note" style="margin:-6px 0 14px">※ 현재 재학 중인 <b>전일제(full-time)</b> 대학원생과 학부연구생(학석연계과정 포함)만 표시합니다. 파트타임(직장 병행) 과정은 포함하지 않습니다.</p>
      <div class="subtabs" role="tablist" aria-label="Student categories" id="subtabs"></div>
      <div class="grid c3" id="student-cards"></div>
    </section>

    <section id="panel-alumni" class="panel" role="tabpanel" hidden>
      <h2 class="kicker">Alumni</h2>
      <div id="alumni-list"></div>
    </section>

  </div>
</main>

<div id="site-footer"></div>

<script>
(function () {
  const M = (window.LAB_DATA || {}).members || {};
  const li = (arr) => (arr || []).map((x) => `<li>${esc(x)}</li>`).join("");

  /* ---------- 교수 / 명예교수 (이력서형 블록) ---------- */
  function personBlock(p) {
    if (!p) return "";
    const sec = [];
    if (p.education && p.education.length) sec.push(`<div><h4>Education</h4><ul>${li(p.education)}</ul></div>`);
    if (p.career && p.career.length) sec.push(`<div><h4>Career</h4><ul>${li(p.career)}</ul></div>`);
    if (p.activities && p.activities.length) sec.push(`<div><h4>Professional Activities</h4><ul>${li(p.activities)}</ul></div>`);
    if (p.awards && p.awards.length) sec.push(`<div><h4>Awards &amp; Honors</h4><ul>${li(p.awards)}</ul></div>`);
    if (p.courses && ((p.courses.ug || []).length || (p.courses.grad || []).length)) {
      sec.push(`<div class="full"><h4>Courses</h4>
        ${(p.courses.ug || []).length ? `<p style="margin:0 0 4px"><b>학부</b> · ${esc(p.courses.ug.join(" · "))}</p>` : ""}
        ${(p.courses.grad || []).length ? `<p style="margin:0"><b>대학원</b> · ${esc(p.courses.grad.join(" · "))}</p>` : ""}
      </div>`);
    }
    return `<article class="person">
      <div class="photo ph">${p.photo
        ? `<img src="${esc(p.photo)}" alt="${esc(p.nameEn)}" data-label="Photo" onerror="imgFallback(this)">`
        : `<span class="ph-label">Photo</span>`}</div>
      <div>
        <h3>${esc(p.nameEn)} <span class="ko">(${esc(p.nameKo)})</span></h3>
        <p class="role">${esc(p.role)}</p>
        <p class="meta">${esc(p.dept)}</p>
        <p class="meta">${p.email ? `Email: <a href="mailto:${esc(p.email)}">${esc(p.email)}</a>` : ""}${p.office ? ` &nbsp;·&nbsp; Office: ${esc(p.office)}` : ""}</p>
        <div>${(p.interests || []).map((t) => `<span class="pill">${esc(t)}</span>`).join("")}</div>
        ${sec.length ? `<div class="cv">${sec.join("")}</div>` : ""}
      </div>
    </article>`;
  }
  document.getElementById("prof-block").innerHTML = personBlock(M.professor) || `<p class="empty">등록된 정보가 없습니다.</p>`;
  document.getElementById("emeritus-block").innerHTML = personBlock(M.emeritus) || `<p class="empty">등록된 정보가 없습니다.</p>`;

  /* ---------- 학생 카드 ---------- */
  window.avatarFallback = function (img, ini) {
    const d = document.createElement("div");
    d.className = "avatar";
    d.textContent = ini;
    img.replaceWith(d);
  };
  // 과정 코드: phd 박사 | ms 석사 | ug 학부연구생 (학석연계 포함; 옛 코드 bsms 도 ug 로 취급)
  const LEVELS = [["phd", "Ph.D."], ["ms", "M.S."], ["ug", "Undergraduate"]];
  const LEVEL = { phd: "Ph.D. Student", ms: "M.S. Student", bsms: "B.S.–M.S. Combined Student", ug: "Undergraduate Researcher" };
  const lv = (s) => (s.level === "bsms" || s.level === "msphd" ? (s.level === "bsms" ? "ug" : "phd") : s.level);
  const students = M.students || [];
  document.getElementById("subtabs").innerHTML =
    [["all", "All"], ...LEVELS].map(([k, l]) => { const n = k === "all" ? students.length : students.filter((s) => lv(s) === k).length;
      return `<button type="button" data-sub="${k}" class="${k === "all" ? "active" : ""}">${l} <span style="opacity:.65;font-weight:600">${n}</span></button>`; }).join("");

  function card(s) {
    const name = `${s.nameEn || ""}${s.nameKo ? ` (${s.nameKo})` : ""}`;
    const ini = initials(s.nameEn || s.nameKo);
    const photo = s.photo
      ? `<img src="${esc(s.photo)}" alt="${esc(name)}" onerror="avatarFallback(this,'${ini}')">`
      : `<div class="avatar">${ini}</div>`;
    return `<div class="s-card" data-level="${esc(s.level)}">
      <div class="s-photo">${photo}</div>
      <div class="s-body">
        <h3 class="s-name">${esc(name)}</h3>
        <div class="s-sub">${esc(s.status || LEVEL[s.level] || "")}</div>
        <div class="divider"></div>
        <div class="s-label">Research Interests</div>
        <div>${(s.interests || []).map((t) => `<span class="pill">${esc(t)}</span>`).join("")}</div>
        ${s.email ? `<div class="s-row"><b>Email:</b> <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></div>` : ""}
      </div>
    </div>`;
  }
  const EMPTY = { all: "등록된 학생이 없습니다.", phd: "현재 박사과정 학생이 없습니다.", ms: "현재 석사과정 학생이 없습니다.", ug: "현재 학부연구생(학석연계 포함)이 없습니다." };
  function renderStudents(filter) {
    const data = students.filter((s) => filter === "all" || lv(s) === filter);
    const el = document.getElementById("student-cards");
    el.innerHTML = data.map(card).join("") || `<p class="empty" style="grid-column:1/-1">${EMPTY[filter] || EMPTY.all}</p>`;
  }
  renderStudents("all");
  document.getElementById("cnt-students").textContent = students.length;
  document.querySelectorAll("#subtabs button").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll("#subtabs button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      renderStudents(b.dataset.sub);
    });
  });

  /* ---------- 졸업생: 졸업 연월(graduated, YYYY-MM) 내림차순 → 최근 졸업생이 먼저 ---------- */
  const DEG = { "Ph.D.": "박사", "M.S.": "석사", "B.S.": "학사" };
  const fmtYM = (s) => (s ? String(s).replace("-", ".") : "");
  function renderAlumni(list) {
    const sorted = (list || []).slice().sort((a, b) =>
      String(b.graduated || "").localeCompare(String(a.graduated || "")) || String(a.nameEn || "").localeCompare(String(b.nameEn || "")));
    document.getElementById("cnt-alumni").textContent = sorted.length;
    if (!sorted.length) { document.getElementById("alumni-list").innerHTML = `<p class="empty">졸업생 정보는 준비 중입니다.</p>`; return; }
    let html = "", year = null;
    sorted.forEach((a) => {
      const y = String(a.graduated || "").slice(0, 4) || "기타";
      if (y !== year) { year = y; html += `${html ? "</div>" : ""}<div class="year-head">${esc(y)}</div><div class="alumni">`; }
      html += `<div class="card">
        <b>${esc(a.nameEn || "")}${a.nameKo ? ` (${esc(a.nameKo)})` : ""}</b>
        <small>${[a.degree ? `${esc(a.degree)}${DEG[a.degree] ? ` (${DEG[a.degree]})` : ""}` : "", fmtYM(a.graduated) ? `${esc(fmtYM(a.graduated))} 졸업` : ""].filter(Boolean).join(" · ")}</small>
        ${a.thesis ? `<p style="margin:8px 0 0;font-size:14px">${esc(a.thesis)}</p>` : ""}
        ${a.current ? `<p style="margin:6px 0 0;font-size:14px;color:var(--muted)">현재: ${esc(a.current)}</p>` : ""}
      </div>`;
    });
    document.getElementById("alumni-list").innerHTML = html + "</div>";
  }
  renderAlumni(M.alumni || []);
  window.__renderAlumni = renderAlumni;   // (테스트/미리보기용)

  /* ---------- 상단 탭 (URL 해시 연동: members.html#students) ---------- */
  const tabs = document.querySelectorAll(".tabs button[data-tab]");
  function activate(key, scroll) {
    if (!document.getElementById("panel-" + key)) key = "prof";
    tabs.forEach((b) => {
      const on = b.dataset.tab === key;
      b.classList.toggle("active", on);
      b.setAttribute("aria-selected", String(on));
    });
    document.querySelectorAll(".panel").forEach((p) => (p.hidden = p.id !== "panel-" + key));
    if (scroll) history.replaceState(null, "", "#" + key);
  }
  tabs.forEach((b) => b.addEventListener("click", () => activate(b.dataset.tab, true)));
  activate((location.hash || "#prof").slice(1), false);
  window.addEventListener("hashchange", () => activate(location.hash.slice(1), false));
})();
</script>
</body>
</html>
